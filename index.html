<!DOCTYPE html>
<html lang="en">
<head>
    <!-- meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=screen-width, initial-scale=1.0">


    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/e113552f85.js" crossorigin="anonymous"></script>


    <!-- css file -->
    <link rel="stylesheet" href="css/style.css">


    <title>Venn</title>

</head>
<body>
    <div id="loading-screen" hidden>
        <p>Loading...</p>
        <span class="loader"></span>
    </div>

    <main>
        <button id="like-button"></button>

        <div id="card-area">
            <div class="card" id="movie-tv-card">
                <div class="container" id="movie-tv-container">
                    <p id="movie-title"></p>
                    <p id="year"></p>
                    <span id="movie-or-tv"></span>
                    <img id="movie-cover" src="" alt="Media Cover">
                    <div id="extra-info">
                        <p id="desc"></p>
                        <span id="rt">
                            <img id="rt-icon" src="" alt="Rotten Tomatoes Icon">
                            <p id="rt-score"></p>
                        </span>
                        <span id="imdb">
                            <img id="imdb-icon" src="" alt="IMDb Icon">
                            <p id="imdb-score"></p>
                        </span>
                    </div>
                </div>
                <div id="status">
                    <p id="status-text"></p>
                </div>
            </div>

            <div class="card" id="youtube-card" hidden>
                <div class="container" id="youtube-container">
                    <p id="yt-title"></p>
                    <p id="yt-channel"></p>
                    <img id="yt-cover" src="" alt="YouTube Cover">
                    <span id="yt-views">
                        <i class="fa-solid fa-eye"></i>
                        <p id="yt-views-count"></p>
                    </span>
                </div>
                <div id="yt-status">
                    <p id="yt-status-text"></p>
                </div>
            </div>

            <button id="skip-button"></button>
        </div>

    </main>

    <div id="title-page" hidden>
        <h2>Venn.</h2>
        <p>For long distance relationships, with nothing to watch.</p>
        <button id="start-button">Start</button>
    </div>

    <div id="preferences" hidden>
        <p>Preferences</p>
        <!-- will design this screen later -->
    </div>

    <div id="choose-media" hidden>
        <button id="choose-movie-button">
            <p>Movies and TV</p>
            <i class="fa-solid fa-film"></i>
        </button>
        <button id="choose-yt">
            <p>YouTube</p>
            <i class="fa-brands fa-youtube"></i>
        </button>
    </div>

    <div id="session-menu" hidden>
        <p>Join a Venn session:</p>
        <input type="text" id="session-code-input" placeholder="Enter session code">
        <button id="join-session-button">Join</button>
        <p>Host a session:</p>
        <button id="host-session-button">Host</button>
        <p id="session-code-display" hidden>Session Code: <span id="session-code"></span></p>
    </div>

    <div id="found" hidden>
        <div id="content-card">
            <img id="found-media-cover" src="" alt="Found Media Cover">
            <p id="found-title"></p>
        </div>
        <button id="watch-button">Watch</button>
        <button id="found-skip-button">Skip</button>
        <p id="watch-status"></p>
    </div>


    <script type="module" src="js/main.js"></script>

</body>
</html>
