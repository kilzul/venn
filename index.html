<!DOCTYPE html>
<html lang="en">
<head>
    <!-- meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/e113552f85.js" crossorigin="anonymous"></script>

    <!-- css file -->
    <link rel="stylesheet" href="css/style.css">

    <title>Venn</title>
</head>
<body>
    <div id="loading-screen" hidden>
        <p>Loading...</p>
        <span class="loader"></span>
    </div>


    <div class="page" id="title-page">
        <h2>Venn.</h2>
        <p>For long distance relationships, with nothing to watch.</p>
        <button id="start-button">Start</button>
    </div>

    <div class="page" id="choose-mode" hidden>
        <button id="choose-movie">
            <p>Movies and TV</p>
            <i class="fa-solid fa-film"></i>
        </button>
        <button id="choose-yt" disabled>
            <p>YouTube</p>
            <i class="fa-brands fa-youtube"></i>
            <small>Coming soon</small>
        </button>
        <p id="choose-status"></p>
    </div>

    <div class="page" id="preferences" hidden>
        <p id="prefs-title">What kind of movies do you like?</p>
        <p id="prefs-instructions">
            Click your favourites in order of importance. Your first pick counts the most.
            Click a genre again to unselect it.
        </p>
        <div id="genre-container"></div>
        <p id="prefs-message"></p>
        <p id="prefs-status"></p>
        <button id="prefs-continue" disabled>Continue</button>
    </div>


    <div class="page" id="session-menu" hidden>
        <p>Join a Venn session:</p>
        <input type="text" id="session-code-input" placeholder="Enter session code">
        <button id="join-session-button">Join</button>
        <p id="join-status"></p>
        <p>Host a session:</p>
        <button id="host-session-button">Host</button>
        <p id="host-status"></p>
        <p id="session-code-display" hidden>Session Code: <span id="session-code"></span></p>
    </div>


    <main class="page" id="swipe" hidden>
        <button id="skip-button" aria-label="Skip"><i class="fa-solid fa-xmark"></i></button>

        <div id="card-area">
            <div class="card" id="movie-tv-card" hidden>
                <div class="container" id="movie-tv-container">
                    <img id="movie-cover" src="" alt="Media Cover">
                    <p id="movie-title"></p>
                    <p id="year"></p>
                    <p id="desc"></p>
                    <div id="extra-info">
                        <div id="genres"></div>
                        <span id="rating">
                            <span id="rating-icon"><i class="fa-solid fa-star"></i></span>
                            <p id="score"></p>
                        </span>
                    </div>
                </div>
                <div id="status">
                    <p id="status-text"></p>
                </div>
            </div>

            <div class="card" id="youtube-card" hidden>
                <div class="container" id="youtube-container">
                    <p id="yt-title"></p>
                    <p id="yt-channel"></p>
                    <img id="yt-cover" src="" alt="YouTube Cover">
                    <span id="yt-views">
                        <i class="fa-solid fa-eye"></i>
                        <p id="yt-views-count"></p>
                    </span>
                </div>
                <div id="yt-status">
                    <p id="yt-status-text"></p>
                </div>
            </div>

            <button id="like-button" aria-label="Like"><i class="fa-solid fa-heart"></i></button>
        </div>

        <button id="back-to-prefs" hidden>Change preferences</button>
    </main>

    <div class="page" id="found" hidden>
        <div id="content-card">
            <img id="found-media-cover" src="" alt="Found Media Cover">
            <p id="found-title"></p>
            <p id="found-description"></p>
        </div>
        <button id="watch-button">Watch</button>
        <button id="found-skip-button">Skip</button>
        <p id="watch-status"></p>
    </div>

    <div class="page" id="celebration" hidden>
        <h2>It's a match!</h2>
        <img id="celebration-cover" src="" alt="">
        <p id="celebration-title"></p>
        <p id="celebration-description"></p>
        <button><a id="watch-link" href="#" target="_blank" rel="noopener noreferrer">Watch now</a></button>
        <button id="keep-swiping-button">Keep swiping</button>
    </div>

    <!-- peer js import --->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
